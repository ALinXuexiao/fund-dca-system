<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"
     role="img" aria-labelledby="brandTitle brandDesc">
  <title id="brandTitle">Coin with a rising trend arrow</title>
  <desc id="brandDesc">A gold coin mark carrying an upward zig-zag trend arrow. Six concentric
  elliptical bands plus one analytic polygon, so every part can be choreographed on its own.</desc>

  <!-- Geometry generated by brand/outputs/fit_work/gen_svg.py from measurements of the source
       raster. Band radii are the radii that extremise luminance along 120 rays of the source;
       the gradient stops are the source's own colour averaged into bins along one shared, nearly
       vertical light axis, so every band is lit from the same direction. -->
  <defs>
    <linearGradient id="coinLipGrad" gradientUnits="userSpaceOnUse" x1="138.0" y1="24.5" x2="118.0" y2="233.0">
      <stop offset="0.000" stop-color="#D5B673"/>
      <stop offset="0.125" stop-color="#E8D692"/>
      <stop offset="0.250" stop-color="#E9D288"/>
      <stop offset="0.375" stop-color="#E3C678"/>
      <stop offset="0.500" stop-color="#CFA14D"/>
      <stop offset="0.625" stop-color="#B1762D"/>
      <stop offset="0.750" stop-color="#AD6F2B"/>
      <stop offset="0.875" stop-color="#C48446"/>
      <stop offset="1.000" stop-color="#CE9058"/>
    </linearGradient>
    <linearGradient id="coinBevelGrad" gradientUnits="userSpaceOnUse" x1="137.8" y1="27.3" x2="118.2" y2="231.7">
      <stop offset="0.000" stop-color="#F7EB99"/>
      <stop offset="0.125" stop-color="#F7ED9B"/>
      <stop offset="0.250" stop-color="#F6EDA0"/>
      <stop offset="0.375" stop-color="#F2E28E"/>
      <stop offset="0.500" stop-color="#E3C25E"/>
      <stop offset="0.625" stop-color="#E4B446"/>
      <stop offset="0.750" stop-color="#D39837"/>
      <stop offset="0.875" stop-color="#D1983A"/>
      <stop offset="1.000" stop-color="#CF8C32"/>
    </linearGradient>
    <linearGradient id="coinPlatformGrad" gradientUnits="userSpaceOnUse" x1="137.7" y1="28.3" x2="118.3" y2="230.4">
      <stop offset="0.000" stop-color="#F7E488"/>
      <stop offset="0.125" stop-color="#F5DF80"/>
      <stop offset="0.250" stop-color="#F2D775"/>
      <stop offset="0.375" stop-color="#ECCF6A"/>
      <stop offset="0.500" stop-color="#E7C55E"/>
      <stop offset="0.625" stop-color="#DEB651"/>
      <stop offset="0.750" stop-color="#D3A546"/>
      <stop offset="0.875" stop-color="#C59139"/>
      <stop offset="1.000" stop-color="#BB822F"/>
    </linearGradient>
    <linearGradient id="coinRingGrad" gradientUnits="userSpaceOnUse" x1="136.7" y1="38.6" x2="119.3" y2="220.0">
      <stop offset="0.000" stop-color="#C59643"/>
      <stop offset="0.125" stop-color="#D2AD55"/>
      <stop offset="0.250" stop-color="#DAB85C"/>
      <stop offset="0.375" stop-color="#E4C464"/>
      <stop offset="0.500" stop-color="#E5C766"/>
      <stop offset="0.625" stop-color="#E1C368"/>
      <stop offset="0.750" stop-color="#DCB762"/>
      <stop offset="0.875" stop-color="#DAB667"/>
      <stop offset="1.000" stop-color="#D5AA5E"/>
    </linearGradient>
    <linearGradient id="coinGrooveGrad" gradientUnits="userSpaceOnUse" x1="136.4" y1="41.6" x2="119.6" y2="217.1">
      <stop offset="0.000" stop-color="#BD7227"/>
      <stop offset="0.125" stop-color="#C57B27"/>
      <stop offset="0.250" stop-color="#C87C27"/>
      <stop offset="0.375" stop-color="#D18A31"/>
      <stop offset="0.500" stop-color="#DD9C3C"/>
      <stop offset="0.625" stop-color="#ECBC50"/>
      <stop offset="0.750" stop-color="#F1D266"/>
      <stop offset="0.875" stop-color="#ECC558"/>
      <stop offset="1.000" stop-color="#F2D36D"/>
    </linearGradient>
    <linearGradient id="coinFaceGrad" gradientUnits="userSpaceOnUse" x1="136.0" y1="45.6" x2="120.0" y2="212.8">
      <stop offset="0.000" stop-color="#F6DF82"/>
      <stop offset="0.125" stop-color="#F4DC7D"/>
      <stop offset="0.250" stop-color="#F1D370"/>
      <stop offset="0.375" stop-color="#EDCA64"/>
      <stop offset="0.500" stop-color="#E5BD57"/>
      <stop offset="0.625" stop-color="#DDB04F"/>
      <stop offset="0.750" stop-color="#D29F44"/>
      <stop offset="0.875" stop-color="#C9923B"/>
      <stop offset="1.000" stop-color="#C28832"/>
    </linearGradient>
    <linearGradient id="arrowFill" gradientUnits="userSpaceOnUse" x1="200" y1="70" x2="70" y2="195">
      <stop offset="0" stop-color="#FAFAF8"/>
      <stop offset="1" stop-color="#F4F4F1"/>
    </linearGradient>
    <!-- Motion scaffolding. Everything below rests in a state that leaves the resting
         frame identical to the geometry-QA'd vector, so Phase 2 stays valid: the wipe band
         covers the whole arrow (front at local x = 86, arrow ends at 84.08) and the sheen
         group is base opacity 0. Only the animations move them. -->
    <linearGradient id="arrowWipeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.985" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <mask id="arrowWipe" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <g transform="translate(127.27 129.22) rotate(-38.969)">
        <rect id="arrowWipeBand" x="-500.0" y="-200" width="594.9" height="400"
              fill="url(#arrowWipeGrad)"/>
      </g>
    </mask>
    <clipPath id="coinClip">
      <ellipse cx="127.27" cy="129.22" rx="114.75" ry="118.50"/>
    </clipPath>
    <linearGradient id="coinSheenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g id="mark">
    <g id="coin">
      <ellipse id="coinLip" cx="127.27" cy="129.22" rx="114.73" ry="118.48" fill="url(#coinLipGrad)"/>
      <ellipse id="coinBevel" cx="127.27" cy="129.22" rx="112.28" ry="115.95" fill="url(#coinBevelGrad)"/>
      <ellipse id="coinPlatform" cx="127.27" cy="129.22" rx="110.69" ry="114.31" fill="url(#coinPlatformGrad)"/>
      <ellipse id="coinRing" cx="127.27" cy="129.22" rx="99.32" ry="102.56" fill="url(#coinRingGrad)"/>
      <ellipse id="coinGroove" cx="127.27" cy="129.22" rx="96.15" ry="99.29" fill="url(#coinGrooveGrad)"/>
      <ellipse id="coinFace" cx="127.27" cy="129.22" rx="91.60" ry="94.60" fill="url(#coinFaceGrad)"/>
    </g>

      <path id="arrow" pathLength="1" fill="url(#arrowFill)" mask="url(#arrowWipe)"
            d="M 194.428 76.433 L 191.556 109.045 L 182.491 104.461 L 161.317 134.044
               L 143.582 128.374 L 123.773 165.186 L 100.671 158.585 L 83.113 187.021
               L 65.557 180.674 L 90.416 137.015 L 113.731 143.651 L 132.739 106.750
               L 155.420 113.465 L 166.528 96.575 L 162.293 86.511 Z"/>

    <g id="coinSheen" clip-path="url(#coinClip)" opacity="0">
      <g transform="rotate(-32 128 128)">
        <rect id="coinSheenBand" x="-90" y="-200" width="180" height="400"
              fill="url(#coinSheenGrad)"/>
      </g>
    </g>
  </g>
</svg>
