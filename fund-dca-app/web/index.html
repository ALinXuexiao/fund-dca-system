<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>基金持仓看板与定投决策系统</title>
    <!--
      首屏占位：启动脚本在「前端开发服务器一就绪」时就会打开浏览器，
      此时 Vue 的 JS/样式可能还没下载执行完。这段内联样式与骨架不依赖任何
      外部资源，能让用户立刻看到界面轮廓，而不是白屏。
      Vue 挂载到 #app 时会整体替换掉这里的占位内容。
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #f4f5f7;
        color: #1a2332;
        font: 14px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      }
      #boot-splash {
        max-width: 1280px;
        margin: 0 auto;
        padding: 22px 24px;
      }
      #boot-splash .boot-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }
      #boot-splash h1 {
        margin: 0;
        font-size: 20px;
      }
      #boot-splash .boot-sub {
        margin: 6px 0 0;
        color: #6b7280;
        font-size: 13px;
      }
      #boot-splash .boot-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border-radius: 999px;
        background: #fff;
        box-shadow: 0 1px 3px rgba(16, 24, 40, 0.08);
        color: #6b7280;
      }
      #boot-splash .boot-spin {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 2px solid #d7dbe2;
        border-top-color: #1a2332;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      #boot-splash .boot-shimmer {
        margin-top: 20px;
        height: 14px;
        border-radius: 6px;
        background: linear-gradient(90deg, #eceef2 25%, #f6f7f9 37%, #eceef2 63%);
        background-size: 400% 100%;
        animation: boot-shimmer 1.4s ease infinite;
      }
      #boot-splash .boot-shimmer.short {
        width: 38%;
        margin-top: 12px;
      }
      #boot-splash .boot-hint {
        margin-top: 22px;
        color: #6b7280;
        font-size: 13px;
      }
      @keyframes boot-shimmer {
        from {
          background-position: 100% 50%;
        }
        to {
          background-position: 0 50%;
        }
      }
    </style>
  </head>
  <body>
<!-- brand-intro:start -->
    <!-- Logo reveal / brand intro. Generated by brand/outputs/fit_work/gen_intro.py
         from brand/logo.svg + brand/motion.css - regenerate, do not hand-edit. -->
    <style>
    /* ---- brand intro (logo reveal) ----------------------------------------
       Played once on top of the app shell, then faded away. Geometry is the
       same vector that passed the Phase 2 overlay QA; choreography numbers
       mirror brand/motion.css. Everything is inline, so the reveal paints
       before any bundle is fetched. */
    #brand-intro {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: #f4f5f7;
      transition: opacity 640ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    #brand-intro.bi-hide {
      opacity: 0;
      pointer-events: none;
    }
    #brand-intro .bi-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    #brand-intro .bi-logo {
      width: 132px;
      height: 132px;
      display: block;
    }
    #brand-intro .bi-word {
      margin: 0;
      color: #1a2332;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    #brand-intro .bi-sub {
      margin: 0;
      color: #6b7280;
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    /* Scale/rotate pivots sit on each part's own geometry, never on the canvas. */
    #brand-intro #coin {
      transform-box: fill-box;
      transform-origin: center;
    }

    #brand-intro #coin {
      animation: bi-coin-in 6400ms both;
    }
    #brand-intro #arrowWipeBand {
      animation: bi-arrow-wipe 6400ms both;
    }
    #brand-intro #coinSheen {
      animation: bi-sheen-fade 6400ms both;
    }
    #brand-intro #coinSheenBand {
      animation: bi-sheen-sweep 6400ms both;
    }
    #brand-intro .bi-word {
      animation: bi-word-in 6400ms both;
    }
    #brand-intro .bi-sub {
      animation: bi-sub-in 6400ms both;
    }

    @keyframes bi-coin-in {
      0% {
        transform: scale(0.88) rotate(-3.4deg);
        opacity: 0;
        animation-timing-function: cubic-bezier(0.4, 0, 0.6, 1);
      }
      9% {
        opacity: 1;
        animation-timing-function: cubic-bezier(0.4, 0, 0.6, 1);
      }
      20% {
        transform: scale(0.845) rotate(-4.2deg);
        animation-timing-function: cubic-bezier(0, 0, 0.2, 1);
      }
      48% {
        transform: scale(1.015) rotate(0.85deg);
        animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
      70% {
        transform: scale(0.998) rotate(-0.18deg);
        animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
      88%,
      100% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
    }
    @keyframes bi-arrow-wipe {
      0%,
      25% {
        transform: translateX(-196px);
        animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
      72%,
      100% {
        transform: translateX(0px);
      }
    }
    @keyframes bi-sheen-fade {
      0%,
      58% {
        opacity: 0;
        animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
      70% {
        opacity: 0.85;
        animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
      94%,
      100% {
        opacity: 0;
      }
    }
    @keyframes bi-sheen-sweep {
      0%,
      58% {
        transform: translateX(-190px);
        animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
      94%,
      100% {
        transform: translateX(190px);
      }
    }
    /* Follow-through: the wordmark trails the mark by 2-4 frames, never in lockstep. */
    @keyframes bi-word-in {
      0%,
      64% {
        opacity: 0;
        transform: translateY(8px);
        animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
      80%,
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @keyframes bi-sub-in {
      0%,
      72% {
        opacity: 0;
        transform: translateY(6px);
        animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
      88%,
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Reduced motion: show the finished mark at once, no choreography. */
    @media (prefers-reduced-motion: reduce) {
      #brand-intro * {
        animation: none !important;
      }
    }
    </style>
    <div id="brand-intro" aria-hidden="true">
      <div class="bi-stage">
      <svg class="bi-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"
           aria-hidden="true">
        <title id="brandTitle">Coin with a rising trend arrow</title>
        <desc id="brandDesc">A gold coin mark carrying an upward zig-zag trend arrow. Six concentric
        elliptical bands plus one analytic polygon, so every part can be choreographed on its own.</desc>

        <!-- Geometry generated by brand/outputs/fit_work/gen_svg.py from measurements of the source
             raster. Band radii are the radii that extremise luminance along 120 rays of the source;
             the gradient stops are the source's own colour averaged into bins along one shared, nearly
             vertical light axis, so every band is lit from the same direction. -->
        <defs>
          <linearGradient id="coinLipGrad" gradientUnits="userSpaceOnUse" x1="138.0" y1="24.5" x2="118.0" y2="233.0">
            <stop offset="0.000" stop-color="#D5B673"/>
            <stop offset="0.125" stop-color="#E8D692"/>
            <stop offset="0.250" stop-color="#E9D288"/>
            <stop offset="0.375" stop-color="#E3C678"/>
            <stop offset="0.500" stop-color="#CFA14D"/>
            <stop offset="0.625" stop-color="#B1762D"/>
            <stop offset="0.750" stop-color="#AD6F2B"/>
            <stop offset="0.875" stop-color="#C48446"/>
            <stop offset="1.000" stop-color="#CE9058"/>
          </linearGradient>
          <linearGradient id="coinBevelGrad" gradientUnits="userSpaceOnUse" x1="137.8" y1="27.3" x2="118.2" y2="231.7">
            <stop offset="0.000" stop-color="#F7EB99"/>
            <stop offset="0.125" stop-color="#F7ED9B"/>
            <stop offset="0.250" stop-color="#F6EDA0"/>
            <stop offset="0.375" stop-color="#F2E28E"/>
            <stop offset="0.500" stop-color="#E3C25E"/>
            <stop offset="0.625" stop-color="#E4B446"/>
            <stop offset="0.750" stop-color="#D39837"/>
            <stop offset="0.875" stop-color="#D1983A"/>
            <stop offset="1.000" stop-color="#CF8C32"/>
          </linearGradient>
          <linearGradient id="coinPlatformGrad" gradientUnits="userSpaceOnUse" x1="137.7" y1="28.3" x2="118.3" y2="230.4">
            <stop offset="0.000" stop-color="#F7E488"/>
            <stop offset="0.125" stop-color="#F5DF80"/>
            <stop offset="0.250" stop-color="#F2D775"/>
            <stop offset="0.375" stop-color="#ECCF6A"/>
            <stop offset="0.500" stop-color="#E7C55E"/>
            <stop offset="0.625" stop-color="#DEB651"/>
            <stop offset="0.750" stop-color="#D3A546"/>
            <stop offset="0.875" stop-color="#C59139"/>
            <stop offset="1.000" stop-color="#BB822F"/>
          </linearGradient>
          <linearGradient id="coinRingGrad" gradientUnits="userSpaceOnUse" x1="136.7" y1="38.6" x2="119.3" y2="220.0">
            <stop offset="0.000" stop-color="#C59643"/>
            <stop offset="0.125" stop-color="#D2AD55"/>
            <stop offset="0.250" stop-color="#DAB85C"/>
            <stop offset="0.375" stop-color="#E4C464"/>
            <stop offset="0.500" stop-color="#E5C766"/>
            <stop offset="0.625" stop-color="#E1C368"/>
            <stop offset="0.750" stop-color="#DCB762"/>
            <stop offset="0.875" stop-color="#DAB667"/>
            <stop offset="1.000" stop-color="#D5AA5E"/>
          </linearGradient>
          <linearGradient id="coinGrooveGrad" gradientUnits="userSpaceOnUse" x1="136.4" y1="41.6" x2="119.6" y2="217.1">
            <stop offset="0.000" stop-color="#BD7227"/>
            <stop offset="0.125" stop-color="#C57B27"/>
            <stop offset="0.250" stop-color="#C87C27"/>
            <stop offset="0.375" stop-color="#D18A31"/>
            <stop offset="0.500" stop-color="#DD9C3C"/>
            <stop offset="0.625" stop-color="#ECBC50"/>
            <stop offset="0.750" stop-color="#F1D266"/>
            <stop offset="0.875" stop-color="#ECC558"/>
            <stop offset="1.000" stop-color="#F2D36D"/>
          </linearGradient>
          <linearGradient id="coinFaceGrad" gradientUnits="userSpaceOnUse" x1="136.0" y1="45.6" x2="120.0" y2="212.8">
            <stop offset="0.000" stop-color="#F6DF82"/>
            <stop offset="0.125" stop-color="#F4DC7D"/>
            <stop offset="0.250" stop-color="#F1D370"/>
            <stop offset="0.375" stop-color="#EDCA64"/>
            <stop offset="0.500" stop-color="#E5BD57"/>
            <stop offset="0.625" stop-color="#DDB04F"/>
            <stop offset="0.750" stop-color="#D29F44"/>
            <stop offset="0.875" stop-color="#C9923B"/>
            <stop offset="1.000" stop-color="#C28832"/>
          </linearGradient>
          <linearGradient id="arrowFill" gradientUnits="userSpaceOnUse" x1="200" y1="70" x2="70" y2="195">
            <stop offset="0" stop-color="#FAFAF8"/>
            <stop offset="1" stop-color="#F4F4F1"/>
          </linearGradient>
          <!-- Motion scaffolding. Everything below rests in a state that leaves the resting
               frame identical to the geometry-QA'd vector, so Phase 2 stays valid: the wipe band
               covers the whole arrow (front at local x = 86, arrow ends at 84.08) and the sheen
               group is base opacity 0. Only the animations move them. -->
          <linearGradient id="arrowWipeGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="0.985" stop-color="#ffffff"/>
            <stop offset="1" stop-color="#000000"/>
          </linearGradient>
          <mask id="arrowWipe" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
            <g transform="translate(127.27 129.22) rotate(-38.969)">
              <rect id="arrowWipeBand" x="-500.0" y="-200" width="594.9" height="400"
                    fill="url(#arrowWipeGrad)"/>
            </g>
          </mask>
          <clipPath id="coinClip">
            <ellipse cx="127.27" cy="129.22" rx="114.75" ry="118.50"/>
          </clipPath>
          <linearGradient id="coinSheenGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
            <stop offset="0.5" stop-color="#ffffff" stop-opacity="1"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
          </linearGradient>
        </defs>

        <g id="mark">
          <g id="coin">
            <ellipse id="coinLip" cx="127.27" cy="129.22" rx="114.73" ry="118.48" fill="url(#coinLipGrad)"/>
            <ellipse id="coinBevel" cx="127.27" cy="129.22" rx="112.28" ry="115.95" fill="url(#coinBevelGrad)"/>
            <ellipse id="coinPlatform" cx="127.27" cy="129.22" rx="110.69" ry="114.31" fill="url(#coinPlatformGrad)"/>
            <ellipse id="coinRing" cx="127.27" cy="129.22" rx="99.32" ry="102.56" fill="url(#coinRingGrad)"/>
            <ellipse id="coinGroove" cx="127.27" cy="129.22" rx="96.15" ry="99.29" fill="url(#coinGrooveGrad)"/>
            <ellipse id="coinFace" cx="127.27" cy="129.22" rx="91.60" ry="94.60" fill="url(#coinFaceGrad)"/>
          </g>

            <path id="arrow" pathLength="1" fill="url(#arrowFill)" mask="url(#arrowWipe)"
                  d="M 194.428 76.433 L 191.556 109.045 L 182.491 104.461 L 161.317 134.044
                     L 143.582 128.374 L 123.773 165.186 L 100.671 158.585 L 83.113 187.021
                     L 65.557 180.674 L 90.416 137.015 L 113.731 143.651 L 132.739 106.750
                     L 155.420 113.465 L 166.528 96.575 L 162.293 86.511 Z"/>

          <g id="coinSheen" clip-path="url(#coinClip)" opacity="0">
            <g transform="rotate(-32 128 128)">
              <rect id="coinSheenBand" x="-90" y="-200" width="180" height="400"
                    fill="url(#coinSheenGrad)"/>
            </g>
          </g>
        </g>
      </svg>
        <p class="bi-word">基金持仓看板与定投决策系统</p>
        <p class="bi-sub">估值采集（蛋卷基金、中证指数） · 真实净值采集（天天基金）</p>
      </div>
    </div>
    <script>
      // Brand intro: play the reveal, then fade the overlay out and drop it.
      // Deliberately a timer, not a data callback: the app underneath may still be
      // fetching, and the splash must never wait on it.
      (function () {
        var intro = document.getElementById('brand-intro');
        if (!intro) return;
        var params = new URLSearchParams(location.search);
        var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // QA hooks, mirroring the pixel2motion contract: ?t=<ms> freezes the clock,
        // ?static=1 jumps to the finished frame. Both keep the overlay in place.
        if (params.has('t') || params.has('static')) {
          var anims = document.getAnimations();
          for (var i = 0; i < anims.length; i++) {
            if (params.has('static')) {
              anims[i].finish();
            } else {
              anims[i].pause();
              anims[i].currentTime = Number(params.get('t'));
            }
          }
          intro.classList.add('bi-hide');
          intro.style.opacity = '1';
          intro.style.transition = 'none';
          return;
        }

        function drop() {
          intro.classList.add('bi-hide');
          window.setTimeout(function () {
            if (intro.parentNode) intro.parentNode.removeChild(intro);
          }, 400);
        }
        // Handover is a TIMER derived from the choreography, never a data callback.
        // Reduced motion: no reveal to watch, so hand over almost immediately.
        window.setTimeout(drop, reduced ? 900 : 7000);
      })();
    </script>
    <!-- brand-intro:end -->
    <div id="app">
      <div id="boot-splash">
        <div class="boot-bar">
          <div>
            <h1>基金持仓看板与定投决策系统</h1>
            <p class="boot-sub">估值采集（蛋卷基金、中证指数） · 真实净值采集（天天基金）</p>
          </div>
          <div class="boot-chip"><span class="boot-spin"></span>界面加载中…</div>
        </div>
        <div class="boot-shimmer"></div>
        <div class="boot-shimmer short"></div>
        <p class="boot-hint">正在加载界面资源，通常只需一两秒…</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
